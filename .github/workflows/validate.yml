name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Manifest Verification
        run: python3 set-it-up/scripts/verify.py

      - name: Run Test Suite
        run: python3 -m unittest discover -s tests -v

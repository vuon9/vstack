name: release

# Cut a release with release-please (the go-please flow). Trigger manually (you
# don't need it automatic yet). It reads the conventional commits since the last
# release, opens or updates a single release PR whose description groups changes
# into typed lists, and creates the tag and GitHub release when that PR merges.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # release-please cannot create the PR with the built-in GITHUB_TOKEN
          # on a push-to-main run (GitHub blocks it: "GitHub Actions is not
          # permitted to create or approve pull requests"). Use a PAT instead;
          # it also lets the resulting release PR trigger CI on its own commits.
          # Create a fine-grained PAT with Contents: Read/Write and PRs: Read/Write
          # and store it as the RELEASE_PLEASE_TOKEN secret.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: simple
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
